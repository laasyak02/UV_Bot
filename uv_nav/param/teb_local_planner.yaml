TebLocalPlannerROS:
  odom_topic: odom 
  acc_lim_theta: 0.5 #1 #0.4
  acc_lim_x: 0.05 #0.1
  acc_lim_y: 0.0
  allow_init_with_backwards_motion: false
  cmd_angle_instead_rotvel: false
  costmap_obstacles_behind_robot_dist: 0.2
  dt_hysteresis: 0.1  #0.08  #0.3
  dt_ref: 0.3 #0.6
  dynamic_obstacle_inflation_dist: 0.6
  enable_multithreading: true
  exact_arc_length: false
  feasibility_check_no_poses: 8 #3
  force_reinit_new_goal_angular: 0.78
  force_reinit_new_goal_dist: 1.0
  free_goal_vel: false
  global_plan_overwrite_orientation: false
  global_plan_viapoint_sep: -1 #0 #0.5 good value
  xy_goal_tolerance: 0.3
  yaw_goal_tolerance: 3
  h_signature_prescaler: 1.0
  h_signature_threshold: 0.1
  max_number_classes: 1
  obstacle_heading_threshold: 0.40
  roadmap_graph_area_length_scale: 1.0
  roadmap_graph_area_width: 5.0
  roadmap_graph_no_samples: 15
  selection_alternative_time_cost: false
  selection_cost_hysteresis: 1.0
  selection_obst_cost_scale: 2.0
  selection_prefer_initial_plan: 0.95
  selection_viapoint_cost_scale: 0.0
  switching_blocking_period: 0.0
  viapoints_all_candidates: true
  visualize_hc_graph: false
  include_costmap_obstacles: true
  include_dynamic_obstacles: false
  inflation_dist: 0.3
  legacy_obstacle_association: false
  min_obstacle_dist: 0.23
  obstacle_association_cutoff_factor: 5.0
  obstacle_association_force_inclusion_factor: 1.5
  obstacle_poses_affected: 15 #8
  no_inner_iterations: 4
  no_outer_iterations: 1 #1
  obstacle_cost_exponent: 1.0
  optimization_activate: true
  optimization_verbose: true
  penalty_epsilon: 0.001
  weight_acc_lim_theta: 1.0
  weight_acc_lim_x: 1.0
  weight_acc_lim_y: 1.0
  weight_adapt_factor: 2.0
  weight_dynamic_obstacle: 50.0
  weight_dynamic_obstacle_inflation: 0.1
  weight_inflation: 0.1
  weight_kinematics_forward_drive: 10000.0
  weight_kinematics_nh: 1000.0
  weight_kinematics_turning_radius: 1
  weight_max_vel_theta: 1 #1.0
  weight_max_vel_x: 2.0
  weight_max_vel_y: 2.0
  weight_obstacle: 50.0
  weight_optimaltime: 1.0
  weight_shortest_path: 0.0
  weight_viapoint: 1.0
  oscillation_recovery: true
  shrink_horizon_backup: true
  is_footprint_dynamic: false
  max_global_plan_lookahead_dist: 0
  max_vel_theta: 0.6
  max_vel_x: 0.3
  max_vel_x_backwards: 0.1
  max_vel_y: 0.0
  min_turning_radius: 0.0 
  publish_feedback: false
  teb_autosize: true
  via_points_ordered: false
  visualize_with_time_as_z_axis_scale: 0.0
  enable_homotopy_class_planning: true

  footprint_model:
    type: "circular"
    radius: 0.23 #0.27

  ## Costmap converter plugin   
  costmap_converter_plugin: "costmap_converter::CostmapToLinesDBSRANSAC"
  # costmap_converter_plugin: "costmap_converter::CostmapToPolygonsDBSMCCH"
  #costmap_converter_plugin: "costmap_converter::CostmapToLinesDBSMCCH"
  #costmap_converter_plugin: "costmap_converter::CostmapToPolygonsDBSConcaveHull"
  #costmap_converter_plugin: "" # deactivate plugin
  costmap_converter_spin_thread: True
  costmap_converter_rate: 5
 
 
  ## Configure plugins (namespace move_base/TebLocalPlannerROS/PLUGINNAME)
  ## The parameters must be added for each plugin separately
  costmap_converter/CostmapToLinesDBSRANSAC:
    cluster_max_distance: 0.4
    cluster_min_pts: 2
    ransac_inlier_distance: 0.15
    ransac_min_inliers: 10
    ransac_no_iterations: 2000
    ransac_remainig_outliers: 3
    ransac_convert_outlier_pts: True
    ransac_filter_remaining_outlier_pts: False
    convex_hull_min_pt_separation: 0.1
