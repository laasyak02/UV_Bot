local_costmap:
  global_frame: map
  robot_base_frame: base_link
  update_frequency: 10.0 
  publish_frequency: 10.0
  rolling_window: true
  width: 2.4 
  height: 2.4
  resolution: 0.01 # increase to for higher res 0.025

  plugins: 
    - {name: obstacles,    type: "costmap_2d::ObstacleLayer"}
    